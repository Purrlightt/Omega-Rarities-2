<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OR2 - Moderator Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="mod.css">
</head>

<body>
    <div class="bg">
        <div class="grid"></div>
        <div class="orb o1"></div>
        <div class="orb o2"></div>
        <div class="orb o3"
            style="right: 10%; bottom: 20%; background: radial-gradient(circle, rgba(78, 207, 255, 0.2), transparent 70%);">
        </div>
    </div>

    <div class="main-content" style="margin-left:0; max-width: 1100px; margin: 0 auto; padding-top: 20px;">
        <header class="mod-header">
            <div>
                <h1 class="mod-title">Moderator Dashboard</h1>
                <p class="muted" style="font-size: 16px; margin-top: 4px;">Review and manage community insights</p>
            </div>
            <div class="partner-group">
                <img src="assets/BrosDevs.webp" alt="BrosDevs" class="partner-logo">
                <img src="assets/PurrlightStudios.png" alt="PurrlightStudios" class="partner-logo">
            </div>
        </header>

        <section class="mod-stats">
            <div class="mod-card">
                <div class="statLabel">Total Signals</div>
                <div class="statValue" id="statTotal" style="color: #7c4dff; font-size: 32px; font-weight: 800;">—</div>
            </div>
            <div class="mod-card">
                <div class="statLabel">Bug Alerts</div>
                <div class="statValue" id="statBugs" style="color: #ff4d4d; font-size: 32px; font-weight: 800;">—</div>
            </div>
            <div class="mod-card">
                <div class="statLabel">Suggestions</div>
                <div class="statValue" id="statIdeas" style="color: #4ecfff; font-size: 32px; font-weight: 800;">—</div>
            </div>
        </section>

        <div class="mod-controls">
            <div class="mod-search-wrap">
                <span class="search-icon-mod">
                    <svg style="width:20px;height:20px" viewBox="0 0 24 24">
                        <path fill="currentColor"
                            d="M9.5,3A6.5,6.5 0 0,1 16,9.5C16,11.11 15.41,12.59 14.44,13.73L14.71,14H15.5L20.5,19L19,20.5L14,15.5V14.71L13.73,14.44C12.59,15.41 11.11,16 9.5,16A6.5,6.5 0 0,1 3,9.5A6.5,6.5 0 0,1 9.5,3M9.5,5C7,5 5,7 5,9.5C5,12 7,14 9.5,14C12,14 14,12 14,9.5C14,7 12,5 9.5,5Z" />
                    </svg>
                </span>
                <input type="text" id="modSearch" class="mod-search-input"
                    placeholder="Search feedback text, names, or IGNs...">
            </div>

            <div class="custom-dd-mod" id="modCatSelect">
                <div class="dd-selected-mod">
                    <span id="ddLabel">All Categories</span>
                    <svg style="width:18px;height:18px;margin-left:10px" viewBox="0 0 24 24">
                        <path fill="currentColor" d="M7.41,8.58L12,13.17L16.59,8.58L18,10L12,16L6,10L7.41,8.58Z" />
                    </svg>
                </div>
                <div class="dd-options-mod">
                    <div class="dd-item-mod" data-value="All">All Categories</div>
                    <div class="dd-item-mod" data-value="Bug">Bug Report 🪲</div>
                    <div class="dd-item-mod" data-value="Suggestion">Suggestion 💡</div>
                    <div class="dd-item-mod" data-value="General">General / Other 💬</div>
                </div>
            </div>

            <button id="delSelected" class="btn tiny mod-batch-btn">Delete Selected</button>
            <a href="index.html" class="btn ghost tiny" style="border-radius:12px">Back to Hub</a>
            </header>

            <div id="modList">
                <div class="muted" style="text-align: center; padding: 100px;">Establishing connection to the cloud...
                </div>
            </div>

            <div style="height: 100px;"></div>
        </div>

        <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

        <script>
            const firebaseConfig = {
                apiKey: atob("QUl6YVN5Q2RyUGpmVkN1dXhQbEJKWmpQalZvT0VPV0VwUWk3ZmxN"),
                authDomain: "or2-website.firebaseapp.com",
                projectId: "or2-website",
                storageBucket: "or2-website.firebasestorage.app",
                messagingSenderId: "600553286698",
                appId: "1:600553286698:web:e20be6c4f43132c2f4a753",
                measurementId: "G-2NGK5BQE55",
                databaseURL: "https://or2-website-default-rtdb.europe-west1.firebasedatabase.app"
            };

            let db = null;
            let masterData = [];
            let activeCategory = "All";

            function init() {
                firebase.initializeApp(firebaseConfig);
                db = firebase.database();

                db.ref("feedback").on("value", (snap) => {
                    const results = [];
                    snap.forEach(child => {
                        results.push({ ...child.val(), id: child.key });
                    });
                    masterData = results;
                    updateView();
                    updateStats();
                });

                // Custom Dropdown Logic
                const dd = document.getElementById('modCatSelect');
                const ddLabel = document.getElementById('ddLabel');

                dd.addEventListener('click', () => dd.classList.toggle('active'));

                document.querySelectorAll('.dd-item-mod').forEach(item => {
                    item.addEventListener('click', (e) => {
                        e.stopPropagation();
                        activeCategory = item.dataset.value;
                        ddLabel.textContent = item.textContent;
                        dd.classList.remove('active');
                        updateView();
                    });
                });

                document.addEventListener('click', (e) => {
                    if (!dd.contains(e.target)) dd.classList.remove('active');
                });
            }

            function updateStats() {
                document.getElementById('statTotal').textContent = masterData.length;
                document.getElementById('statBugs').textContent = masterData.filter(i => i.category === 'Bug').length;
                document.getElementById('statIdeas').textContent = masterData.filter(i => i.category === 'Suggestion').length;
            }

            function updateView() {
                const list = document.getElementById('modList');
                const query = document.getElementById('modSearch').value.toLowerCase();

                let filtered = masterData.filter(item => {
                    const searchStr = ((item.text || "") + (item.ign || "") + (item.user || "")).toLowerCase();
                    const matchText = searchStr.includes(query);
                    const matchCat = activeCategory === "All" || (item.category || "General") === activeCategory;
                    return matchText && matchCat;
                });

                filtered.sort((a, b) => new Date(b.date) - new Date(a.date));

                if (filtered.length === 0) {
                    list.innerHTML = `<div class="mod-card" style="text-align:center; color: var(--muted2); padding: 60px;">No incoming signals found in this frequency.</div>`;
                    return;
                }

                list.innerHTML = filtered.map((item, index) => {
                    const bClass = (item.category === "Bug") ? "badge-bug" : (item.category === "Suggestion" ? "badge-suggestion" : "badge-general");
                    const dateStr = item.date ? new Date(item.date).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' }) : "Unknown Time";

                    return `
                <div class="mod-card fb-item-mod" style="animation-delay: ${index * 0.05}s">
                    <input type="checkbox" class="fb-checkbox del-check" data-id="${item.id}">
                    <div>
                        <div class="fb-meta-mod">
                            <span class="ign-gradient">${esc(item.ign || "Anonymous User")}</span>
                            <span>•</span>
                            <span>${dateStr}</span>
                            <span class="badge-mod ${bClass}">${esc(item.category || "General")}</span>
                        </div>
                        <div style="color: rgba(255,255,255,0.95); font-size: 16px; line-height: 1.6; white-space: pre-wrap; font-weight: 500;">${esc(item.text)}</div>
                        ${item.fileName ? `<div style="margin-top: 14px; font-size: 13px; color: #4ecfff; display:flex; align-items:center; gap:8px; background: rgba(78, 207, 255, 0.05); padding: 8px 12px; border-radius: 10px; width: fit-content; border: 1px solid rgba(78, 207, 255, 0.2);">
                            <svg style="width:16px;height:16px" viewBox="0 0 24 24"><path fill="currentColor" d="M16.5,6V17.5A4,4 0 0,1 12.5,21.5A4,4 0 0,1 8.5,17.5V5A2.5,2.5 0 0,1 11,2.5A2.5,2.5 0 0,1 13.5,5V15.5A1,1 0 0,1 12.5,16.5A1,1 0 0,1 11.5,15.5V6H10V15.5A2.5,2.5 0 0,0 12.5,18A2.5,2.5 0 0,0 15,15.5V5A4,4 0 0,0 11,1A4,4 0 0,0 7,5V17.5A5.5,5.5 0 0,0 12.5,23A5.5,5.5 0 0,0 18,17.5V6H16.5Z" /></svg>
                            <span style="font-family: var(--mono)">${esc(item.fileName)}</span>
                        </div>` : ''}
                    </div>
                </div>
                `;
                }).join('');
            }

            function esc(str) {
                if (!str) return "";
                return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
            }

            document.getElementById('modSearch').addEventListener('input', updateView);

            document.getElementById('delSelected').addEventListener('click', () => {
                const checks = document.querySelectorAll('.del-check:checked');
                if (checks.length === 0) return alert("Select signals to terminate.");
                if (confirm(`Confirm permanent deletion of ${checks.length} signals?`)) {
                    checks.forEach(c => db.ref("feedback/" + c.dataset.id).remove());
                }
            });

            init();
        </script>
</body>

</html>
